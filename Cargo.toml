[package]
name = "receive"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "receive"
path = "src/bin/receive.rs"

[[bin]]
name = "serve"
path = "src/bin/serve.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
if-addrs = "0.13"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }